name: Build Android APK (release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Definir versao a partir da tag (install over the previous)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          CODE=$((MAJOR*10000 + MINOR*100 + PATCH))
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Versao: $VER (versionCode $CODE)"

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/upload-keystore.jks
          KEYSTORE_PASSWORD: minhaloja123
          KEY_ALIAS: minhaloja
          KEY_PASSWORD: minhaloja123
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" minhaloja-compose.apk
          ls -la minhaloja-compose.apk

      - name: Notas da release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --tags --force
          atual="${GITHUB_REF#refs/tags/}"
          anterior=$(git tag --sort=-v:refname | grep '^v' | sed -n 2p)
          {
            echo 'O que melhorou:';
            echo '';
            if [ -n "$anterior" ]; then
              git log "$anterior..$atual" --pretty=format:'- %s'
              echo '';
              echo '';
              echo "**Full Changelog**: $anterior...$atual";
            else
              git log -10 --pretty=format:'- %s';
            fi
          } > /tmp/notas.txt
          cat /tmp/notas.txt

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: minhaloja-compose.apk
          body_path: /tmp/notas.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Manter somente as duas últimas tags
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --tags --force
          antigas=$(git tag --sort=-v:refname | grep '^v' | tail -n +3)
          for t in $antigas; do
            git push origin ":refs/tags/$t" || true
          done
