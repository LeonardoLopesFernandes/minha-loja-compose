name: Build Android APK (release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Definir versao a partir da tag (install over the previous)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          CODE=$((MAJOR*10000 + MINOR*100 + PATCH))
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Versao: $VER (versionCode $CODE)"

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/upload-keystore.jks
          KEYSTORE_PASSWORD: minhaloja123
          KEY_ALIAS: minhaloja
          KEY_PASSWORD: minhaloja123
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}

      - name: Definir nome e link do APK
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            APK_NAME="minhaloja-compose-${GITHUB_REF_NAME}.apk"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            APK_NAME="minhaloja-compose-dev.apk"
            RELEASE_TAG="latest"
          fi
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}" >> "$GITHUB_ENV"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/*arm64-v8a*.apk "$APK_NAME"
          ls -la "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Preparar notas da release
        run: |
          {
            echo "[**Baixar APK**]($APK_URL)"
            echo ""
          } > /tmp/notas.txt
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git fetch --tags --force
            atual="${GITHUB_REF_NAME}"
            anterior=$(git tag --sort=-v:refname | grep '^v' | sed -n 2p)
            echo 'O que melhorou:' >> /tmp/notas.txt
            echo '' >> /tmp/notas.txt
            if [ -n "$anterior" ]; then
              git log "$anterior..$atual" --pretty=format:'- %s' >> /tmp/notas.txt
              echo '' >> /tmp/notas.txt
              echo '' >> /tmp/notas.txt
              echo "**Full Changelog**: $anterior...$atual" >> /tmp/notas.txt
            else
              git log -10 --pretty=format:'- %s' >> /tmp/notas.txt
            fi
          else
            echo "Build manual a partir do commit ${GITHUB_SHA}." >> /tmp/notas.txt
          fi
          cat /tmp/notas.txt

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: Minha Loja Compose (${{ github.ref_type == 'tag' && github.ref_name || 'latest' }})
          body_path: /tmp/notas.txt
          files: ${{ env.APK_NAME }}
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Manter somente as duas últimas tags
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --tags --force
          antigas=$(git tag --sort=-v:refname | grep '^v' | tail -n +3)
          for t in $antigas; do
            git push origin ":refs/tags/$t" || true
          done
